<!DOCTYPE html>
<html lang="en">
<head>

<title>CV — Daril Quervo | Virtual Assistant & Web Developer</title>
<meta name="description" content="Download the CV of Daril Quervo — Virtual Assistant and web/app developer based in Japan.">
<link rel="canonical" href="https://darilquervo.com/cv/">
<style>
  :root{--bg:#0b0d10;--card:#161a20;--line:#242a33;--text:#e8eaed;--muted:#9aa3ad;--accent:#4fd1a5}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--accent);text-decoration:none}
  header{border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
  .logo{font-weight:800;letter-spacing:.06em}.logo span{color:var(--accent)}
  header a.back{color:var(--muted);font-size:.9rem}
  main{flex:1;max-width:860px;width:100%;margin:0 auto;padding:40px 20px}
  h1{font-size:1.7rem;margin-bottom:6px}
  p.sub{color:var(--muted);margin-bottom:24px}
  .btn{display:inline-block;background:var(--accent);color:var(--bg);font-weight:700;padding:13px 28px;border-radius:999px;margin-bottom:28px}
  .btn:hover{filter:brightness(1.1)}
  .viewer{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .viewer object,.viewer iframe{width:100%;height:78vh;border:none;display:block}
  .fallback{padding:40px;text-align:center;color:var(--muted)}
  footer{border-top:1px solid var(--line);padding:22px;text-align:center;color:var(--muted);font-size:.85rem}

  <a class="btn" href="Daril-Quervo-CV.pdf" download>⬇ Download CV (PDF)</a>
  <div class="viewer">
    <object data="Daril-Quervo-CV.pdf" type="application/pdf">
      <div class="fallback">
        <p>Your browser can't preview PDFs here.</p>
        <p><a href="Daril-Quervo-CV.pdf" download>Download the CV instead →</a></p>
      </div>
    </object>

<footer>© Daril Quervo · <a href="mailto:darilquervo.dev@gmail.com">darilquervo.dev@gmail.com</a></footer>
